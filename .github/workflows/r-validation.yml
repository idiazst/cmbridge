name: Package checks and recovery validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check R package
        shell: Rscript {0}
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error", check_dir = "check")
      - name: Install package with tests
        run: R CMD INSTALL --install-tests .
      - name: Bridge recovery
        run: Rscript tests/validation/validate_bridge.R validation-artifacts/bridge
      - name: Adjoint recovery
        run: Rscript tests/validation/validate_adjoint.R validation-artifacts/adjoint
      - name: Ensemble selection
        run: Rscript tests/validation/validate_ensemble.R validation-artifacts/ensemble
      - name: Inverse-expit bridges and unrestricted adjoints
        run: Rscript tests/validation/validate_linked_bridge.R validation-artifacts/linked-bridge
      - name: Recovery figures
        run: |
          Rscript tests/validation/plot_recovery_truth.R validation-artifacts
          Rscript tests/validation/plot_ensemble_truth.R validation-artifacts/ensemble
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmbridge-validation
          path: |
            validation-artifacts/
            check/
